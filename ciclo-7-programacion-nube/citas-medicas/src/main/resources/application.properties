# Nombre de la aplicacion (visible en logs y en Swagger)
spring.application.name=citas-medicas

# Puerto del servidor. Render inyecta la variable de entorno PORT en
# produccion; en local, si no existe, se usa 8080 por defecto.
server.port=${PORT:8080}

# Base de datos H2 en memoria (decision acordada: sin servidor externo,
# libre eleccion segun el enunciado del caso de estudio)
spring.datasource.url=jdbc:h2:mem:sursaluddb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Necesario para que data.sql se ejecute DESPUES de que Hibernate cree las
# tablas (si no, puede fallar porque las tablas aun no existen).
spring.jpa.defer-datasource-initialization=true

# Consola web de H2, util para inspeccionar la base de datos en
# http://localhost:8080/h2-console (JDBC URL: jdbc:h2:mem:sursaluddb)
spring.h2.console.enabled=true
spring.h2.console.settings.web-allow-others=true

# Swagger UI / OpenAPI docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Devuelve mensajes de error mas claros (util para depurar durante el curso)
server.error.include-message=always
